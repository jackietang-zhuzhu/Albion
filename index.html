<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albion Online 个人助手 (T4-T6)</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tesseract.js (用于截图识别价格) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">

    <!-- 配置 Supabase 密钥提示区（也可以直接硬编码在下方 JS 中） -->
    <div class="max-w-7xl mx-auto mb-6 p-4 bg-gray-800 rounded-lg border border-gray-700 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fas me-database text-yellow-500 text-xl"></i>
            <span class="font-bold">Supabase 云端云数据库已就绪</span>
        </div>
        <div class="text-sm text-gray-400" id="db-status">状态：正在连接...</div>
    </div>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- 左侧：买入账本卡片 -->
        <div class="bg-gray-800 p-5 rounded-lg border border-gray-700">
            <h2 class="text-xl font-bold mb-4 text-green-400 flex items-center justify-between">
                <span><i class="fas fa-shopping-cart mr-2"></i>买入账本 (T4-T6)</span>
                <span id="total-buy-cost" class="text-sm font-normal text-gray-300">总花费: 0 银币</span>
            </h2>
            
            <!-- 买入表单 -->
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-4">
                <input id="buy-item-name" type="text" placeholder="物品名称 (如 T4 粗皮)" class="bg-gray-700 p-2 rounded text-sm text-white border border-gray-600 focus:outline-none col-span-2 sm:col-span-1">
                <select id="buy-item-tier" class="bg-gray-700 p-2 rounded text-sm text-white border border-gray-600">
                    <option value="T4">T4</option>
                    <option value="T5">T5</option>
                    <option value="T6">T6</option>
                </select>
                <input id="buy-amount" type="number" placeholder="数量" class="bg-gray-700 p-2 rounded text-sm text-white border border-gray-600">
                <input id="buy-price" type="number" placeholder="单价" class="bg-gray-700 p-2 rounded text-sm text-white border border-gray-600">
                <button onclick="addBuyRecord()" class="bg-green-600 hover:bg-green-500 text-white p-2 rounded text-sm font-bold transition">
                    <i class="fas fa-plus mr-1"></i>记入买入
                </button>
            </div>

            <!-- 买入数据列表 (清空硬编码) -->
            <div class="overflow-x-auto max-h-60 overflow-y-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-700 text-gray-300 sticky top-0">
                        <tr>
                            <th class="p-2">物品</th>
                            <th class="p-2">阶级</th>
                            <th class="p-2">数量</th>
                            <th class="p-2">单价</th>
                            <th class="p-2">总计</th>
                            <th class="p-2">操作</th>
                        </tr>
                    </thead>
                    <tbody id="buy-ledger-tbody" class="divide-y divide-gray-700">
                        <!-- 数据库加载 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 右侧：卖出账本卡片 -->
        <div class="bg-gray-800 p-5 rounded-lg border border-gray-700">
            <h2 class="text-xl font-bold mb-4 text-blue-400 flex items-center justify-between">
                <span><i class="fas fa-coins mr-2"></i>卖出账本 (T4-T6)</span>
                <span id="total-sell-revenue" class="text-sm font-normal text-gray-300">总收入: 0 银币</span>
            </h2>
            
            <!-- 卖出表单 -->
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-4">
                <input id="sell-item-name" type="text" placeholder="物品名称 (如 T5 成品皮)" class="bg-gray-700 p-2 rounded text-sm text-white border border-gray-600 col-span-2 sm:col-span-1">
                <select id="sell-item-tier" class="bg-gray-700 p-2 rounded text-sm text-white border border-gray-600">
                    <option value="T4">T4</option>
                    <option value="T5">T5</option>
                    <option value="T6">T6</option>
                </select>
                <input id="sell-amount" type="number" placeholder="数量" class="bg-gray-700 p-2 rounded text-sm text-white border border-gray-600">
                <input id="sell-price" type="number" placeholder="单价" class="bg-gray-700 p-2 rounded text-sm text-white border border-gray-600">
                <button onclick="addSellRecord()" class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded text-sm font-bold transition">
                    <i class="fas fa-plus mr-1"></i>记入卖出
                </button>
            </div>

            <!-- 卖出数据列表 (清空硬编码) -->
            <div class="overflow-x-auto max-h-60 overflow-y-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-700 text-gray-300 sticky top-0">
                        <tr>
                            <th class="p-2">物品</th>
                            <th class="p-2">阶级</th>
                            <th class="p-2">数量</th>
                            <th class="p-2">单价</th>
                            <th class="p-2">总计</th>
                            <th class="p-2">操作</th>
                        </tr>
                    </thead>
                    <tbody id="sell-ledger-tbody" class="divide-y divide-gray-700">
                        <!-- 数据库加载 -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- 市场截图识别模块 -->
    <div class="max-w-7xl mx-auto mt-6 bg-gray-800 p-5 rounded-lg border border-gray-700">
        <h3 class="text-lg font-bold mb-3 text-purple-400 flex items-center">
            <i class="fas fa-camera mr-2"></i>截图识别市场物价 (OCR)
        </h3>
        <div class="flex flex-wrap items-center gap-4">
            <label class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded text-sm font-bold cursor-pointer transition">
                <i class="fas fa-upload mr-2"></i>选择/拖入市场截图
                <input type="file" id="ocr-image-input" accept="image/*" class="hidden" onchange="handleImageOCR(this)">
            </label>
            <span id="ocr-status" class="text-sm text-gray-400">选择包含市场单价的截图，自动扫描识别数值</span>
        </div>
        <div id="ocr-result" class="mt-3 text-sm font-mono text-yellow-300 hidden"></div>
    </div>

    <!-- JavaScript 脚本区 -->
    <script>
        // 1. 初始化 Supabase 实例 (请填写你的真实项目的 URL 与 anon Key)
        const SUPABASE_URL = 'https://zwhzwzhfmihzwqrbkorz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3aHp3emhmbWloendxcmJrb3J6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MTIzMzAwMiwiZXhwIjoyMTA2ODA5MDAyfQ.KzGwsW9AGRcw69QhDR9LV2n5qBT-n5QDDV-WaN1u0mo';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 初始化加载
        document.addEventListener('DOMContentLoaded', () => {
            checkDatabaseConnection();
            loadBuyRecords();
            loadSellRecords();
        });

        // 检查连接状态
        async function checkDatabaseConnection() {
            const statusEl = document.getElementById('db-status');
            try {
                const { data, error } = await db.from('buy_records').select('id').limit(1);
                if (error) throw error;
                statusEl.innerText = '状态：已在线连接';
                statusEl.classList.replace('text-gray-400', 'text-green-400');
            } catch (err) {
                statusEl.innerText = '状态：连接失败 (请检查 URL/Key 配置)';
                statusEl.classList.replace('text-gray-400', 'text-red-400');
            }
        }

        // --- 买入账本逻辑 ---
        async function loadBuyRecords() {
            const tbody = document.getElementById('buy-ledger-tbody');
            tbody.innerHTML = '<tr><td colspan="6" class="p-3 text-center text-gray-500">加载中...</td></tr>';

            const { data, error } = await db.from('buy_records').select('*').order('created_at', { ascending: false });
            if (error) return console.error(error);

            tbody.innerHTML = '';
            let totalCost = 0;

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-3 text-center text-gray-500">暂无买入记录</td></tr>';
            }

            data.forEach(item => {
                const total = item.amount * item.price;
                totalCost += total;
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-750">
                        <td class="p-2">${item.item_name}</td>
                        <td class="p-2"><span class="px-2 py-0.5 rounded bg-gray-700 text-xs">${item.tier}</span></td>
                        <td class="p-2">${item.amount}</td>
                        <td class="p-2">${item.price.toLocaleString()}</td>
                        <td class="p-2 text-green-400 font-bold">${total.toLocaleString()}</td>
                        <td class="p-2">
                            <button onclick="deleteBuyRecord(${item.id})" class="text-red-400 hover:text-red-300">
                                <i class="fas fa-trash text-xs"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('total-buy-cost').innerText = `总花费: ${totalCost.toLocaleString()} 银币`;
        }

        async function addBuyRecord() {
            const name = document.getElementById('buy-item-name').value.trim();
            const tier = document.getElementById('buy-item-tier').value;
            const amount = parseInt(document.getElementById('buy-amount').value);
            const price = parseFloat(document.getElementById('buy-price').value);

            if (!name || isNaN(amount) || isNaN(price)) {
                alert('请填写完整有效的信息！');
                return;
            }

            const { error } = await db.from('buy_records').insert([
                { item_name: name, tier: tier, amount: amount, price: price }
            ]);

            if (error) {
                alert('记入失败: ' + error.message);
            } else {
                // 清空输入框并刷新列表
                document.getElementById('buy-item-name').value = '';
                document.getElementById('buy-amount').value = '';
                document.getElementById('buy-price').value = '';
                loadBuyRecords();
            }
        }

        async function deleteBuyRecord(id) {
            if (!confirm('确定删除该笔记录？')) return;
            await db.from('buy_records').delete().eq('id', id);
            loadBuyRecords();
        }

        // --- 卖出账本逻辑 ---
        async function loadSellRecords() {
            const tbody = document.getElementById('sell-ledger-tbody');
            tbody.innerHTML = '<tr><td colspan="6" class="p-3 text-center text-gray-500">加载中...</td></tr>';

            const { data, error } = await db.from('sell_records').select('*').order('created_at', { ascending: false });
            if (error) return console.error(error);

            tbody.innerHTML = '';
            let totalRevenue = 0;

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-3 text-center text-gray-500">暂无卖出记录</td></tr>';
            }

            data.forEach(item => {
                const total = item.amount * item.price;
                totalRevenue += total;
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-750">
                        <td class="p-2">${item.item_name}</td>
                        <td class="p-2"><span class="px-2 py-0.5 rounded bg-gray-700 text-xs">${item.tier}</span></td>
                        <td class="p-2">${item.amount}</td>
                        <td class="p-2">${item.price.toLocaleString()}</td>
                        <td class="p-2 text-blue-400 font-bold">${total.toLocaleString()}</td>
                        <td class="p-2">
                            <button onclick="deleteSellRecord(${item.id})" class="text-red-400 hover:text-red-300">
                                <i class="fas fa-trash text-xs"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('total-sell-revenue').innerText = `总收入: ${totalRevenue.toLocaleString()} 银币`;
        }

        async function addSellRecord() {
            const name = document.getElementById('sell-item-name').value.trim();
            const tier = document.getElementById('sell-item-tier').value;
            const amount = parseInt(document.getElementById('sell-amount').value);
            const price = parseFloat(document.getElementById('sell-price').value);

            if (!name || isNaN(amount) || isNaN(price)) {
                alert('请填写完整有效的信息！');
                return;
            }

            const { error } = await db.from('sell_records').insert([
                { item_name: name, tier: tier, amount: amount, price: price }
            ]);

            if (error) {
                alert('记入失败: ' + error.message);
            } else {
                document.getElementById('sell-item-name').value = '';
                document.getElementById('sell-amount').value = '';
                document.getElementById('sell-price').value = '';
                loadSellRecords();
            }
        }

        async function deleteSellRecord(id) {
            if (!confirm('确定删除该笔记录？')) return;
            await db.from('sell_records').delete().eq('id', id);
            loadSellRecords();
        }

        // --- 截图 OCR 物价提取 ---
        async function handleImageOCR(input) {
            const file = input.files[0];
            if (!file) return;

            const statusEl = document.getElementById('ocr-status');
            const resultEl = document.getElementById('ocr-result');

            statusEl.innerText = '⏳ 正在解析识别图片中的数值，请稍候...';
            resultEl.classList.add('hidden');

            try {
                const worker = await Tesseract.createWorker('eng'); // 阿尔比恩界面价格数字通常为数字/英文
                const ret = await worker.recognize(file);
                await worker.terminate();

                // 筛选识别出的纯数字串（价格通常为多位数字）
                const numbers = ret.data.text.match(/\b\d{1,3}(,\d{3})*|\d+\b/g);

                if (numbers && numbers.length > 0) {
                    statusEl.innerText = '✅ 识别成功！匹配到以下可能的单价数值：';
                    resultEl.innerHTML = numbers.map(num => `<span class="inline-block bg-gray-700 px-2 py-1 rounded mr-2 mb-1 cursor-pointer hover:bg-yellow-500 hover:text-black" onclick="fillPrice('${num.replace(/,/g, '')}')">${num} 银币</span>`).join('');
                    resultEl.classList.remove('hidden');
                } else {
                    statusEl.innerText = '⚠️ 未在图片中检测到明显的数值，请确保截图清晰。';
                }
            } catch (err) {
                console.error(err);
                statusEl.innerText = '❌ 图片解析出错。';
            }
        }

        // 点击识别到的数值，自动填入买入单价栏
        function fillPrice(val) {
            document.getElementById('buy-price').value = val;
            alert(`已自动填入单价: ${val}`);
        }
    </script>
</body>
</html>
